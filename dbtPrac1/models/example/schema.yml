
version: 2

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
  - name: stg_customers
    description: "Staging view for users table from default schema"

  - name: stg_orders
    description: "Staging view for orders data with minimal cleaning"

  - name: orders_summary
    description: "Daily order and revenue summary aggregated by date"

  - name: fct_orders
    description: "Incremental fact table storing all orders"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
      - name: updated_at
        description: "Timestamp when the order was last updated"
      - name: amount
        description: "Order amount"
