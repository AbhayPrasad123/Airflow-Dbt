name: Build DAG Generator Wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build package
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        working-directory: Airflow
        run: |
          python -m build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dag-generator-wheel
          path: |
            Airflow/dist/*.whl
            Airflow/dist/*.tar.gz
